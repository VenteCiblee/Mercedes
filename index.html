  .grille{
    position:absolute;inset:4.5% 5%;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(6,1fr);
    gap:3.2cqw;
  }

  /* ---------- Cases ---------- */
  .case{
    position:relative;
    border:max(1.5px,.35cqw) dashed rgba(255,255,255,.8);
    border-radius:2.4cqw;
    background:rgba(14,12,10,.12);
    color:#fff;
    font:inherit;font-weight:700;font-size:7.5cqw;
    text-shadow:0 1px 6px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.6);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .2s,background .3s,box-shadow .3s;
    -webkit-tap-highlight-color:transparent;
  }
  .case:active{transform:scale(.94)}
  .case.dispo{border-color:#fff;animation:lueur 2.4s infinite}
  .case.dispo:hover{background:rgba(245,212,143,.18)}
  @keyframes lueur{
    0%,100%{box-shadow:0 0 0 0 rgba(245,212,143,0)}
    50%{box-shadow:0 0 3cqw .3cqw rgba(245,212,143,.7)}
  }
  .case.verrou{
    color:rgba(255,255,255,.55);
    border-color:rgba(255,255,255,.45);
    background:transparent;cursor:default;
  }
  /* Case ouverte : une niche vide, avec le picto du cadeau */
  .case.ouverte{
    border:max(1px,.25cqw) solid rgba(245,212,143,.75);
    background:radial-gradient(circle at 50% 40%,rgba(30,24,16,.72),rgba(6,5,4,.85));
    box-shadow:inset 0 1.2cqw 3cqw rgba(0,0,0,.9),inset 0 -.5cqw 1.5cqw rgba(245,212,143,.12);
    text-shadow:none;
  }
  .case .num{
    position:absolute;top:1.1cqw;left:1.7cqw;
    font-size:3cqw;font-weight:600;color:var(--or);
  }
  .case .picto{width:58%;height:58%;color:var(--or-vif);filter:drop-shadow(0 0 1.5cqw rgba(245,212,143,.35))}
  .case.juste-ouverte{animation:ouverture .6s ease-out}
  @keyframes ouverture{
    0%{transform:scale(1.15);box-shadow:0 0 6cqw 2cqw rgba(245,212,143,.8)}
    100%{transform:none}
  }

  /* ---------- Pop-up cadeau (grand format) ---------- */
  .voile{
    position:fixed;inset:0;z-index:40;
    background:radial-gradient(circle at 50% 35%,rgba(60,44,20,.55),rgba(4,3,2,.92) 70%);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    display:flex;align-items:center;justify-content:center;
    padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
    opacity:0;pointer-events:none;transition:opacity .3s;
  }
  .voile.visible{opacity:1;pointer-events:auto}
  .cadeau{
    position:relative;
    width:min(100%,520px);
    max-height:100%;
    height:min(100%,860px);
    display:flex;flex-direction:column;
    background:#fffdf8;color:#1d1a15;
    border-radius:24px;overflow:hidden;
    box-shadow:0 0 0 1px rgba(245,212,143,.5),0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(245,212,143,.25);
    transform:scale(.6) rotate(-3deg);opacity:0;
    transition:transform .45s cubic-bezier(.2,1.3,.4,1),opacity .3s;
  }
  .voile.visible .cadeau{transform:none;opacity:1}
  .cadeau-visuel{
    position:relative;flex:1 1 auto;min-height:0;
    background:#fff;
  }
  .cadeau-visuel img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cadeau-visuel.contenu img{object-fit:contain;padding:6%}
  .cadeau-visuel .sans-image{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#3a2c16,#141210 75%);color:var(--or-vif);
  }
  .cadeau-visuel .sans-image svg{width:40%;height:40%}
  .badge{
    position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);z-index:2;
    background:linear-gradient(145deg,var(--or-vif),var(--or-fonce));color:#1c1408;
    font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    padding:9px 18px;border-radius:999px;white-space:nowrap;
    box-shadow:0 6px 18px rgba(0,0,0,.25);
  }
  .cadeau-texte{flex:0 0 auto;padding:34px 24px 22px;text-align:center}
  .cadeau-texte h2{
    font-family:'Playfair Display',serif;font-weight:700;
    font-size:clamp(1.9rem,8.5vw,2.6rem);line-height:1.08;
  }
  .cadeau-texte p{margin-top:12px;font-size:clamp(1.02rem,4.4vw,1.2rem);line-height:1.45;color:#4a443a;font-weight:500}
  .ok{
    display:block;width:100%;margin-top:20px;padding:15px;
    border:0;border-radius:14px;background:#1d1a15;color:var(--or-vif);
    font:inherit;font-weight:600;font-size:1rem;cursor:pointer;
  }
  .croix{
    position:absolute;top:12px;right:12px;z-index:3;
    width:40px;height:40px;border-radius:50%;border:0;
    background:rgba(20,18,16,.6);color:#fff;font-size:1.3rem;line-height:40px;cursor:pointer;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }

  .toast{
    position:fixed;left:50%;bottom:24px;z-index:50;
    transform:translate(-50%,20px);opacity:0;
    background:rgba(255,253,248,.96);color:#1d1a15;
    padding:12px 18px;border-radius:12px;font-size:.95rem;font-weight:600;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    transition:all .25s;pointer-events:none;width:max-content;max-width:calc(100% - 32px);text-align:center;
  }
  .toast.visible{opacity:1;transform:translate(-50%,0)}
  .test{
    position:fixed;top:0;left:0;right:0;z-index:30;
    background:#ffcc00;color:#000;text-align:center;
    font-size:.8rem;font-weight:600;padding:6px 10px;
  }
  .test button{margin-left:8px;font:inherit;padding:1px 8px;border-radius:6px;border:1px solid #000;background:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="test" id="test" hidden></div>

<div class="lp" role="img" aria-label="Garage Monnier vous souhaite un joyeux Noël – calendrier de l'Avent">
  <div class="grille" id="grille"></div>
</div>

<div class="voile" id="voile" role="dialog" aria-modal="true" aria-labelledby="cadeau-titre">
  <div class="cadeau">
    <button class="croix" id="croix" aria-label="Fermer">✕</button>
    <div class="cadeau-visuel" id="cadeau-visuel">
      <div class="badge" id="cadeau-badge"></div>
    </div>
    <div class="cadeau-texte">
      <h2 id="cadeau-titre"></h2>
      <p id="cadeau-sous-titre"></p>
      <button class="ok" id="ok">Fermer</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

];
for (let i = CADEAUX.length; i < 24; i++) {
  CADEAUX.push({ titre:"Cadeau du jour " + (i + 1), sousTitre:"Offre à définir.", image:"", cadrage:"cover", picto:"cadeau" });
}

/* =====================================================
   LOGIQUE
   ===================================================== */
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const params = new URLSearchParams(location.search);
let aujourdhui = new Date();
let bandeauTexte = "";
if (params.get("date")) {
  const [a, m, j] = params.get("date").split("-").map(Number);
  if (a && m && j) { aujourdhui = new Date(a, m - 1, j); bandeauTexte = "Test : " + j + " " + MOIS[m - 1] + " " + a; }
}
aujourdhui.setHours(0, 0, 0, 0);
const debloque = TOUT_DEBLOQUER && !params.get("date");
if (debloque) bandeauTexte = "Mode test : toutes les cases sont débloquées";
if (bandeauTexte) {
  const b = document.getElementById("test");
  b.hidden = false;
  b.innerHTML = bandeauTexte + '<button id="reset">Réinitialiser</button>';
  document.getElementById("reset").onclick = () => { try { localStorage.removeItem(CLE_STOCKAGE); } catch(e){} location.reload(); };
}

function dateCase(n) { const d = new Date(DATE_DEBUT); d.setDate(d.getDate() + n - 1); return d; }
function libelle(d) { return d.getDate() + " " + MOIS[d.getMonth()]; }
function ouvrable(n) { return debloque || dateCase(n) <= aujourdhui; }

let ouvertes = (() => { try { return JSON.parse(localStorage.getItem(CLE_STOCKAGE)) || []; } catch(e) { return []; } })();
function enregistrer() { try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(ouvertes)); } catch(e) {} }

const grille = document.getElementById("grille");
function dessiner(justeOuverte) {
  grille.innerHTML = "";
  for (let n = 1; n <= 24; n++) {
    const b = document.createElement("button");
    b.className = "case";
    if (ouvertes.includes(n)) {
      b.classList.add("ouverte");
      if (n === justeOuverte) b.classList.add("juste-ouverte");
      b.innerHTML = '<span class="num">' + n + '</span>' + PICTOS[CADEAUX[n - 1].picto].replace("<svg", '<svg class="picto"');
      b.setAttribute("aria-label", "Case " + n + ", ouverte : " + CADEAUX[n - 1].titre);
    } else if (ouvrable(n)) {
      b.classList.add("dispo"); b.textContent = n;
      b.setAttribute("aria-label", "Case " + n + ", à ouvrir");
    } else {
      b.classList.add("verrou"); b.textContent = n;
      b.setAttribute("aria-label", "Case " + n + ", disponible le " + libelle(dateCase(n)));
    }
    b.onclick = () => cliquer(n);
    grille.appendChild(b);
  }
}
function cliquer(n) {
  if (!ouvrable(n)) { toast("Patience ! Cette case s'ouvre le " + libelle(dateCase(n)) + "."); return; }
  const premiere = !ouvertes.includes(n);
  if (premiere) { ouvertes.push(n); enregistrer(); }
  afficherCadeau(n);
  if (premiere) dessiner(n);
}

const voile = document.getElementById("voile");
const zoneVisuel = document.getElementById("cadeau-visuel");
function afficherCadeau(n) {
  const c = CADEAUX[n - 1];
  zoneVisuel.querySelectorAll("img,.sans-image").forEach(e => e.remove());
  zoneVisuel.classList.toggle("contenu", c.cadrage === "contain");
  if (c.image) {
    const img = document.createElement("img"); img.src = c.image; img.alt = c.titre;
    zoneVisuel.prepend(img);
  } else {
    const d = document.createElement("div"); d.className = "sans-image"; d.innerHTML = PICTOS[c.picto];
    zoneVisuel.prepend(d);
  }
  document.getElementById("cadeau-badge").textContent = "Case " + n + " · " + libelle(dateCase(n));
  document.getElementById("cadeau-titre").textContent = c.titre;
  document.getElementById("cadeau-sous-titre").textContent = c.sousTitre;
  voile.classList.add("visible");
}
function fermer() { voile.classList.remove("visible"); }
document.getElementById("ok").onclick = fermer;
document.getElementById("croix").onclick = fermer;
voile.onclick = e => { if (e.target === voile) fermer(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") fermer(); });

let minuterie;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("visible");
  clearTimeout(minuterie); minuterie = setTimeout(() => t.classList.remove("visible"), 2600);
}
dessiner();
</script>
